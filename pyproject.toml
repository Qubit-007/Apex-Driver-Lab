[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-driver-lab"
version = "0.1.0"
description = "Procedural traffic simulation and PyTorch reinforcement-learning driving lab"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mayank Patil" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Izzo047/Quantum-Wave-Simulation-with-AI"
Issues = "https://github.com/Izzo047/Quantum-Wave-Simulation-with-AI/issues"

[project.scripts]
apex-driver-lab = "car:main"

[tool.setuptools]
py-modules = ["car", "car_ai", "car_simulation", "car_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
